spring.application.name=cyberguard

# MySQL de XAMPP. La contraseña vacía es el valor por defecto de una instalación local.
spring.datasource.url=jdbc:mysql://localhost:3306/cyberguard?createDatabaseIfNotExist=true&characterEncoding=UTF-8&serverTimezone=America/Bogota&nullCatalogMeansCurrent=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
# XAMPP usa MariaDB. Hibernate 6 no puede leer su metadata JDBC (columna RESERVED).
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

server.port=8080
server.error.whitelabel.enabled=false

# JWT firmado con HS256. En un despliegue real define CYBERGUARD_JWT_SECRET (mínimo 32 caracteres).
cyberguard.jwt.secreto=${CYBERGUARD_JWT_SECRET:cyberguard-secreto-solo-para-desarrollo-local-2026}
cyberguard.jwt.duracion-minutos=120

# Orígenes del frontend autorizados a llamar a la API (separados por coma).
cyberguard.cors.origenes=${CYBERGUARD_CORS_ORIGENES:http://localhost:5173}
